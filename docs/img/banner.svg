<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Vertical Helicopter Altitude Control">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#13233f"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
<radialGradient id="glow" cx=".85" cy=".5" r=".45"><stop offset="0" stop-color="#f5b041" stop-opacity=".22"/><stop offset="1" stop-color="#f5b041" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="320" rx="20" fill="url(#bg)"/>
<rect width="1280" height="320" rx="20" fill="url(#grid)"/>
<rect width="1280" height="320" rx="20" fill="url(#glow)"/>
<rect x="64" y="58" width="56" height="5" rx="2.5" fill="#f5b041"/>
<g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<text x="64" y="128" font-size="40" font-weight="700" fill="#f8fafc">Vertical Helicopter Altitude Control</text>
<text x="64" y="176" font-size="21" fill="#94a3b8">From PID to LQG with Kalman filtering, validated on real hardware</text>
<rect x="64" y="232" width="99" height="34" rx="17" fill="#f5b041" fill-opacity=".12" stroke="#f5b041" stroke-opacity=".55"/><text x="113" y="255" font-size="16" fill="#e2e8f0" text-anchor="middle">PSoC 5LP</text><rect x="174.8" y="232" width="80" height="34" rx="17" fill="#f5b041" fill-opacity=".12" stroke="#f5b041" stroke-opacity=".55"/><text x="215" y="255" font-size="16" fill="#e2e8f0" text-anchor="middle">MATLAB</text><rect x="266.4" y="232" width="108" height="34" rx="17" fill="#f5b041" fill-opacity=".12" stroke="#f5b041" stroke-opacity=".55"/><text x="321" y="255" font-size="16" fill="#e2e8f0" text-anchor="middle">LQR / LQG</text><rect x="386.79999999999995" y="232" width="70" height="34" rx="17" fill="#f5b041" fill-opacity=".12" stroke="#f5b041" stroke-opacity=".55"/><text x="422" y="255" font-size="16" fill="#e2e8f0" text-anchor="middle">LiDAR</text>
</g>
<g transform="translate(980 40)" stroke="#f5b041" fill="#f5b041" stroke-linecap="round" font-family="Segoe UI, Arial, sans-serif"><path d="M50 15 V225 M190 15 V225" stroke-width="5" opacity=".55"/><path d="M38 55 h12 M38 95 h12 M38 135 h12 M38 175 h12" stroke-width="3" opacity=".55"/><path d="M65 92 H175" stroke-width="7"/><circle cx="120" cy="92" r="7"/><path d="M120 99 V112" stroke-width="5"/><rect x="92" y="112" width="56" height="34" rx="6" fill="none" stroke-width="5"/><path d="M50 129 H92 M148 129 H190" stroke-width="3" opacity=".7"/></g>
</svg>
